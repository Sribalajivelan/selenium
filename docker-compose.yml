version: '3.7'

services:
  selenium-hub:
    shm_size: 2gb
    image: docker.io/selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
    environment:
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_MAX_SESSIONS=10
      - SE_NODE_GRID_URL=http://localhost:4444
      - SE_ENABLE_TRACING=false
    healthcheck:
      test: [ "CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444" ]
      interval: 15s
      timeout: 30s
      retries: 5
    networks:
      - selenium-network

  selenium-app:
    image: selenium-app
#    build:
#      context: .
    container_name: selenium-app
    environment:
      - SELENIUM_HUB_URL=http://selenium-hub:4444/wd/hub
      - SE_ENABLE_TRACING=false
    depends_on:
      - selenium-hub
    networks:
      - selenium-network

networks:
  selenium-network:
    driver: bridge
